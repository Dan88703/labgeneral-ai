spring.application.name=labgeneral-ai-backend

spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

server.port=${PORT:8081}

openai.base-url=https://api.groq.com/openai/v1
openai.api-key=${GROQ_API_KEY}
openai.model=llama-3.3-70b-versatile

rag.service.url=${RAG_SERVICE_URL}

cors.allowed-origins=http://localhost:5173,https://labgeneral-ai.vercel.app